<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>entrada: orbita roja</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <main>
        <div class="parteposter">
            <img src="/proyectos-html-css/archivos/p01/poster.jpg" alt="imagen del poster de la pelicula orbita roja">
        </div>

        <div class="parteentrada">
            
            <div class="info">
                <P class="seccionesEntrada">PELICULA :</P>
                <P>Orbita roja (2026)</P>
            </div>
            <hr>
            <div class="info">
                <p class="seccionesEntrada">FECHA :</p>
                <time datetime="2026-09-25">25/09/2026</time>
            </div>
            <hr>
            <div class="info">
                <p class="seccionesEntrada">HORA :</p>
                <time datetime="20:00">8:00 p.m.</time>
            </div>
            <hr>
            <div>
                <div class="fila">
                    <p class="seccionesEntrada">ASIENTO : </p>
                    <p>17-B</p>
                </div>
                <div class="fila">
                    <p class="seccionesEntrada">SALA : </p>
                    <p>04(Primer piso)</p>
                </div>
                <div class="fila">
                    <p class="seccionesEntrada">PRECIO : </p>
                    <p>25.00 pen</p>
                </div>
            </div>
            
        </div>
    </main>
</body>

</html>
