<html> <!--- html : hypertext markup language -->

<head> <!-- Este es el encabezado de la pagina aqui se coloca la informacion que no se muestra en la pagina, como el titulo y los metadatos -->

    <title>mi primera pagina</title>

</head>

<body> <!-- Este es el cuerpo de la pagina aqui se coloca todo lo que se mostrara en la pagina -->
    <p><b>ESTA ES MI PRIMERA PAGINA</b></p> <!-- esto es un comentario -->
    <p>estas en mi <b>primera pagina</b></p> <!-- con el tag 'p' determinamos un parrafo y con el tag 'b' hacemos que sea negrita -->
    <p>pronto aprenderemos mas</p>

</body>


</html>
