<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contacto</title>
</head>

<body>
    <header>
        <div class="logo">
            <img src="isotipo_unprg.png" alt="Logo UNPRG" style="width: 25%;" />
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="quiensoy.html">Sobre mí</a></li>
                <li><a href="hobbies.html">Hobbies</a></li>

            </ul>
        </nav>
    </header>

    <main>
        <h2>Contáctame</h2>
        <form action="#">
            <div>
                <label for="nombre">Nombre</label>
                <input type="text" name="nombre" id="nombre" placeholder="Tu nombre">
            </div>
            <div>
                <label for="correo">Correo</label>
                <input type="email" name="correo" id="correo" placeholder="correo@ejemplo.com">
            </div>
            <div>
                <label for="fechaNac">Fecha de nacimiento</label>
                <input type="date" name="fechaNac" id="fechaNac">
            </div>
            <div>
                <label for="mensaje">Mensaje</label>
                <textarea name="mensaje" id="mensaje" rows="4"></textarea>
            </div>
            <div>
                <label for="esEstudiante">Soy estudiante</label>
                <input type="checkbox" name="esEstudiante" id="esEstudiante">
            </div>
            <div>
                <button type="reset">Limpiar</button>
                <button type="submit">Enviar</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Mauricio Farro. Ingeniería en Computación - UNPRG</p>

            </ul>

    </footer>
</body>
